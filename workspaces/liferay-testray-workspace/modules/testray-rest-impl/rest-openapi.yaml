components:
    schemas:
        TestrayCaseResult:
            properties:
                id1:
                    format: int64
                    type: integer
                id2:
                    format: int64
                    type: integer
                name:
                    type: string
                priority:
                    type: integer
                status1:
                    type: string
                status2:
                    type: string
                testrayComponentName:
                    type: string
                testrayTeamId:
                    format: int64
                    type: integer
            type: object
        TestrayRunComparison:
            properties:
                results:
                    items:
                        type: object
                    type: array
                testrayCaseResults:
                    items:
                        $ref: "#/components/schemas/TestrayCaseResult"
                    type: array
            type: object
info:
    license:
        name: "Apache 2.0"
        url: "http://www.apache.org/licenses/LICENSE-2.0.html"
    title: "Testray REST"
    version: v1.0
openapi: 3.0.1
paths:
    "/testray-run-comparisons/{testrayRunId1}/{testrayRunId2}":
        get:
            operationId: getTestrayRunComparison
            parameters:
                - in: path
                  name: testrayRunId1
                  required: true
                  schema:
                      format: int64
                      type: integer
                - in: path
                  name: testrayRunId2
                  required: true
                  schema:
                      format: int64
                      type: integer
                - in: query
                  name: filter
                  schema:
                      type: string
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/TestrayRunComparison"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/TestrayRunComparison"
            tags: ["TestrayRunComparison"]
    "/testray-run-comparisons/{testrayRunId1}/{testrayRunId2}/details":
        get:
            operationId: getTestrayRunComparisonDetail
            parameters:
                - in: path
                  name: testrayRunId1
                  required: true
                  schema:
                      format: int64
                      type: integer
                - in: path
                  name: testrayRunId2
                  required: true
                  schema:
                      format: int64
                      type: integer
                - in: query
                  name: filter
                  schema:
                      type: string
                - in: query
                  name: testrayCaseResultError1
                  schema:
                      type: string
                - in: query
                  name: testrayCaseResultError2
                  schema:
                      type: string
                - in: query
                  name: testrayCaseResultIssue1
                  schema:
                      type: string
                - in: query
                  name: testrayCaseResultIssue2
                  schema:
                      type: string
                - in: query
                  name: testrayCaseResultStatus1
                  schema:
                      type: string
                - in: query
                  name: testrayCaseResultStatus2
                  schema:
                      type: string
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/TestrayRunComparison"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/TestrayRunComparison"
            tags: ["TestrayRunComparison"]