components:
    schemas:
        TestrayCase:
            properties:
                caseResultStatus1:
                    type: string
                caseResultStatus2:
                    type: string
                component:
                    type: string
                name:
                    type: string
                priority:
                    type: string
            type: object
        TestrayRunComparison:
            properties:
                results:
                    items:
                        type: object
                    type: array
                testrayCases:
                    items:
                        $ref: "#/components/schemas/TestrayCase"
                    type: array
            type: object
info:
    license:
        name: "Apache 2.0"
        url: "http://www.apache.org/licenses/LICENSE-2.0.html"
    title: "Testray REST"
    version: v1.0
openapi: 3.0.1
paths:
    "/testray-run-comparisons/{testrayRunId1}/{testrayRunId2}":
        get:
            operationId: getTestrayRunComparison
            parameters:
                - in: path
                  name: testrayRunId1
                  required: true
                  schema:
                      format: int64
                      type: integer
                - in: path
                  name: testrayRunId2
                  required: true
                  schema:
                      format: int64
                      type: integer
                - in: query
                  name: filter
                  schema:
                      type: string
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/TestrayRunComparison"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/TestrayRunComparison"
            tags: ["TestrayRunComparison"]
    "/testray-run-comparisons/{testrayRunId1}/{testrayRunId2}/details":
        get:
            operationId: getTestrayRunComparisonDetail
            parameters:
                - in: path
                  name: testrayRunId1
                  required: true
                  schema:
                      format: int64
                      type: integer
                - in: path
                  name: testrayRunId2
                  required: true
                  schema:
                      format: int64
                      type: integer
                - in: query
                  name: error1
                  schema:
                      type: string
                - in: query
                  name: error2
                  schema:
                      type: string
                - in: query
                  name: filter
                  schema:
                      type: string
                - in: query
                  name: issues1
                  schema:
                      type: string
                - in: query
                  name: issues2
                  schema:
                      type: string
                - in: query
                  name: status1
                  schema:
                      type: string
                - in: query
                  name: status2
                  schema:
                      type: string
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/TestrayRunComparison"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/TestrayRunComparison"
            tags: ["TestrayRunComparison"]