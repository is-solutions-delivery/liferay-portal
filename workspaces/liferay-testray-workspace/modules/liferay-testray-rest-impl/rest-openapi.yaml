components:
    schemas:
        CompareRuns:
            properties:
                results:
                    items:
                        type: object
                    type: array
                view:
                    type: string
            type: object
info:
    description:
        "Testray REST API. A Java client JAR is available for use with the group ID 'com.liferay', artifact ID
        'com.liferay.testray.rest.client', and version '1.0.0'."
    license:
        name: "Apache 2.0"
        url: "http://www.apache.org/licenses/LICENSE-2.0.html"
    title: "Testray REST"
    version: v1.0
openapi: 3.0.1
paths:
    "/compare-runs/{testrayRunId1}/{testrayRunId2}":
        get:
            operationId: getCompareRuns
            parameters:
                - in: path
                  name: testrayRunId1
                  required: true
                  schema:
                      format: int64
                      type: integer
                - in: path
                  name: testrayRunId2
                  required: true
                  schema:
                      format: int64
                      type: integer
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/CompareRuns"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/CompareRuns"
            tags: ["CompareRuns"]