assemble:
    -   from: batch
        into: batch
ticket:
    name: Ticket
    oAuthApplicationHeadlessServer: ticket-oahs
    type: batch
ticket-oahs:
    .serviceAddress: localhost:8080
    .serviceScheme: http
    name: Ticket OAuth Application Headless Server
    scopes:
        -   Liferay.Headless.Batch.Engine.everything
        -   Liferay.Object.Admin.REST.everything
    type: oAuthApplicationHeadlessServer