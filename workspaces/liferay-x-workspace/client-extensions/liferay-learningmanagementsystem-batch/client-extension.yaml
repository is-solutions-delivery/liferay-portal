assemble:
    -   from: batch
        into: batch
learning-management-system:
    name: Learning Management System
    oAuthApplicationHeadlessServer: learning-management-system-oahs
    type: batch
learning-management-system-oahs:
    .serviceAddress: localhost:8080
    .serviceScheme: http
    name: Learning Management System OAuth Application Headless Server
    scopes:
        -   Liferay.Headless.Batch.Engine.everything
        -   Liferay.Object.Admin.REST.everything
    type: oAuthApplicationHeadlessServer