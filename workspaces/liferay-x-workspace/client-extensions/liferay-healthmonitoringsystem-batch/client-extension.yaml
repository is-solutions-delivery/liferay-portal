assemble:
    -   from: batch
        into: batch
health-monitoring-system:
    name: Health Monitoring System
    oAuthApplicationHeadlessServer: health-monitoring-system-oahs
    type: batch
health-monitoring-system-oahs:
    .serviceAddress: localhost:8080
    .serviceScheme: http
    name: Health Monitoring System OAuth Application Headless Server
    scopes:
        -   Liferay.Headless.Batch.Engine.everything
        -   Liferay.Object.Admin.REST.everything
    type: oAuthApplicationHeadlessServer