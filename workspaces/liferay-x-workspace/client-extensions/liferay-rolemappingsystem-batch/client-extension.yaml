assemble:
    -   from: batch
        into: batch
role-mapping-system:
    name: Role Mapping System
    oAuthApplicationHeadlessServer: role-mapping-system-oahs
    type: batch
role-mapping-system-oahs:
    .serviceAddress: localhost:8080
    .serviceScheme: http
    name: Role Mapping System OAuth Application Headless Server
    scopes:
        -   Liferay.Headless.Batch.Engine.everything
        -   Liferay.Object.Admin.REST.everything
    type: oAuthApplicationHeadlessServer