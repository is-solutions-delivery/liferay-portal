api-gateway-registry-system:
    name: API Gateway Registry System
    oAuthApplicationHeadlessServer: api-gateway-registry-system-oahs
    type: batch
api-gateway-registry-system-oahs:
    .serviceAddress: localhost:8080
    .serviceScheme: http
    name: API Gateway Registry System OAuth Application Headless Server
    scopes:
        -   Liferay.Headless.Batch.Engine.everything
        -   Liferay.Object.Admin.REST.everything
    type: oAuthApplicationHeadlessServer
assemble:
    -   from: batch
        into: batch