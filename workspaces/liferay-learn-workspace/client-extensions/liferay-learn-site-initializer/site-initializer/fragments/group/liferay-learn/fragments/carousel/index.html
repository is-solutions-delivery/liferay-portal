[#assign numberOfSlides = configuration.numberOfSlides?number]

<div aria-label="Featured products carousel" class="carousel-outer-container">
	<div
		class="carousel-main container-fluid container-fluid-max-xl lfr-layout-structure-item-container"
	>
		<div aria-label="Carousel" class="carousel-viewport" role="region">
			<div aria-live="polite" class="carousel-track">
				[#list 1..numberOfSlides as slideIndex]
				<div
					aria-label="Slide ${slideIndex} of ${numberOfSlides}"
					aria-roledescription="slide"
					class="carousel-slide"
					data-slide-index="${slideIndex}"
					role="group"
				>
					<lfr-drop-zone
						class="carousel-dropzone"
						data-lfr-drop-zone-id="${slideIndex}"
						data-lfr-priority="${slideIndex}"
					></lfr-drop-zone>
				</div>
				[/#list]
			</div>
		</div>

		<div class="carousel-container-buttons">
			<button
				aria-label="Previous slide"
				class="carousel-nav-button carousel-prev"
			>
				<svg
					fill="none"
					height="16"
					viewBox="0 0 16 16"
					width="16"
					xmlns="http://www.w3.org/2000/svg"
				>
					<mask
						height="8"
						id="mask0_2203_15949"
						style="mask-type: alpha"
						maskUnits="userSpaceOnUse"
						width="13"
						x="1"
						y="4"
					>
						<path
							d="M4.49582 4.83369L2.25613 7.2365C1.9183 7.63586 1.90579 8.34059 2.25613 8.7735L4.49582 11.1763C5.54684 12.1764 6.83872 10.6461 5.92846 9.63932L5.40608 9.07889H13.001C14.3304 9.07889 14.3304 6.93112 13.001 6.93112H5.40608L5.92846 6.37068C6.86375 5.30351 5.46238 3.83699 4.49582 4.83369Z"
							fill="#6B6C7E"
						/>
					</mask>
					<g mask="url(#mask0_2203_15949)">
						<rect fill="#0B5FFF" height="16" width="16" />
					</g>
				</svg>
			</button>

			<div
				aria-label="Carousel Pagination"
				class="carousel-dots"
				role="tablist"
			>
				[#list 1..numberOfSlides as slideIndex]
				<button
					aria-controls="slide-${slideIndex}"
					aria-label="Go to slide ${slideIndex}"
					class="carousel-dot"
					data-dot-index="${slideIndex - 1}"
					role="tab"
				></button>
				[/#list]
			</div>

			<button
				aria-label="Next slide"
				class="carousel-nav-button carousel-next"
			>
				<svg
					height="16"
					fill="none"
					viewBox="0 0 16 16"
					width="16"
					xmlns="http://www.w3.org/2000/svg"
				>
					<mask
						height="8"
						id="mask0_2203_3054"
						maskUnits="userSpaceOnUse"
						style="mask-type: alpha"
						width="13"
						x="1"
						y="4"
					>
						<path
							d="M11.243 10.9888L13.4805 8.75127C13.818 8.3794 13.8305 7.72315 13.4805 7.32002L11.243 5.08252C10.193 4.15127 8.90234 5.57627 9.81172 6.51377L10.3336 7.03565H2.74609C1.41797 7.03565 1.41797 9.03565 2.74609 9.03565H10.3336L9.81172 9.55752C8.87734 10.5513 10.2773 11.9169 11.243 10.9888Z"
							fill="#6B6C7E"
						/>
					</mask>
					<g mask="url(#mask0_2203_3054)">
						<rect fill="#0B5FFF" height="16" width="16" />
					</g>
				</svg>
			</button>
		</div>
	</div>
</div>
