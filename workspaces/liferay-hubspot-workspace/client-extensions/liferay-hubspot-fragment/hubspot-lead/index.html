<div id="hubspot-lead-form">
	<div class="demo-card">
		<form id="lead-form" method="post">
			<div class="g-3 mb-4 row">
				<div class="col-md-6">
					<label class="form-label">First Name *</label>

				<input class="form-control" name="firstName" placeholder="John" required type="text" />
				</div>

				<div class="col-md-6">
					<label class="form-label">Last Name *</label>

				<input class="form-control" name="lastName" placeholder="Doe" required type="text" />
				</div>

				<div class="col-md-6 mt-2">
					<label class="form-label">Email *</label>

				<input class="form-control" name="email" placeholder="john.doe@contact.me" required type="email" />
				</div>

				<div class="col-md-6 mt-2">
					<label class="form-label">Phone Number *</label>

				<input class="form-control" name="phone" placeholder="+55 11 99999-9999" required type="tel" />
				</div>

				<div class="col-md-12 my-4">
					<label class="form-label">Company Name *</label>

				<input class="form-control" name="companyName" placeholder="Liferay" required type="text" />
				</div>

				<div class="col-md-12 mb-4">
					<label class="form-label">Website URL *</label>

				<input class="form-control" name="websiteURL" placeholder="http://liferay.com" required type="url" />
				</div>

				<div class="col-md-12">
				<label class="form-label">How many employees work there? *</label>

				<input class="form-control" name="numberOfEmployees" placeholder="e.g. 500" required type="number" />
				</div>
			</div>

		<p class="mt-3 small text-muted" data-lfr-editable-id="paragraph-text" data-lfr-editable-type="text">
				We are committed to your privacy. Liferay uses the information
				you provide to contact you about relevant content, products, and
				services. You may unsubscribe at any time.
			</p>

		<button class="btn btn-demo w-100" data-lfr-editable-id="button-text" data-lfr-editable-type="text" id="submit-lead-form" type="submit">
				Get your free demo
			</button>
		</form>
	</div>
</div>
