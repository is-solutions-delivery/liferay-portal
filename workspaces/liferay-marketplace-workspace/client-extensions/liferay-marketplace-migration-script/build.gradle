buildscript {
	dependencies {
		classpath group: "com.liferay", name: "com.liferay.gradle.plugins.defaults", version: "latest.release"
	}

	repositories {
		mavenLocal()

		maven {
			url "https://repository-cdn.liferay.com/nexus/content/groups/public"
		}
	}
}

apply plugin: "application"
apply plugin: "com.liferay.source.formatter"
apply plugin: "java"

dependencies {
	implementation group: "com.liferay", name: "com.liferay.headless.admin.taxonomy.client", version: "latest.release"
	implementation group: "com.liferay", name: "com.liferay.petra.lang", version: "latest.release"
	implementation group: "com.liferay", name: "com.liferay.petra.string", version: "latest.release"
	implementation group: "com.liferay.commerce", name: "com.liferay.headless.commerce.admin.catalog.client", version: "latest.release"
	implementation group: "com.liferay.portal", name: "com.liferay.portal.kernel", version: "latest.release"
	implementation group: "commons-io", name: "commons-io", version: "2.6"
	implementation group: "commons-logging", name: "commons-logging", version: "1.2"
	implementation group: "org.apache.httpcomponents", name: "httpclient", version: "4.5.13"
	implementation group: "org.json", name: "json", version: "20230227"
	implementation group: "org.springframework.boot", name: "spring-boot-starter-web", version: "2.7.9"
	implementation group: "org.springframework.boot", name: "spring-boot-starter-webflux", version: "2.7.9"
}

mainClassName = "com.liferay.marketplace.Main"

repositories {
	mavenLocal()

	maven {
		url "https://repository-cdn.liferay.com/nexus/content/groups/public"
	}
}