<button
	class="d-flex p-2 sites-container"
	data-toggle="liferay-dropdown"
	id="liferay-sites-id"
	tabindex="6"
>
<span class="align-self-center opacity-50 pr-1 sites-icon">[@clay["icon"] symbol="sites"/]</span>
	<div class="d-flex font-weight-semi-bold liferay-sites position-relative">
		<div class="liferay-sites-text opacity-80">
			${languageUtil.get(locale, "liferay-sites", "Liferay Sites")}
		</div>

		<div>
			<span class="account-dropdown-icon caret-bottom-icon">
				[@clay["icon"] symbol="caret-bottom-l"/]
			</span>
			<span class="account-dropdown-icon caret-bottom-icon d-none">
				[@clay["icon"] symbol="caret-top-l"/]
			</span>
		</div>
	</div>
</button>

<div
	aria-labelledby="liferay-sites-id"
	class="dropdown-menu liferay-sites-dropdown"
>
	<lfr-drop-zone> </lfr-drop-zone>
</div>
