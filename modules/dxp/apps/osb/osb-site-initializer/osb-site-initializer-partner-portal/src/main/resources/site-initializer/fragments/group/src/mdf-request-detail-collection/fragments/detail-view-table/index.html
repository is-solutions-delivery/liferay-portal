<table class="table table-borderless w-100">
	<thead>
		<tr>
			<th class="w-50">
				<lfr-editable
					class="text-neutral-10"
					id="tableTitle"
					type="rich-text"
				>
					This is editable text!
				</lfr-editable>
			</th>
			<th class="w-50"></th>
		</tr>
	</thead>

	<tbody class="ml-1">
		[#list 0..configuration.numberOfRows-1 as index]
		<tr>
			<td class="w-50">
				<lfr-editable
					class="text-neutral-10"
					id="rowTitle-${index+1}"
					type="rich-text"
				>
					This is editable text!
				</lfr-editable>
			</td>
			<td class="w-50">
				<lfr-editable
					class="text-neutral-10"
					id="rowValue-${index+1}"
					type="rich-text"
				>
					This is editable text!
				</lfr-editable>
			</td>
		</tr>
		[/#list]
	</tbody>
</table>
